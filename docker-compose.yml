services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: outagemap
      POSTGRES_PASSWORD: outagemap
      POSTGRES_DB: outagemap
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U outagemap']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: outagemap
      MINIO_ROOT_PASSWORD: local-development-change-me
      MINIO_API_CORS_ALLOW_ORIGIN: ${AUTH_URL:-http://localhost:3000}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio:/data
  storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        until mc alias set local http://minio:9000 outagemap local-development-change-me; do sleep 2; done;
        mc mb --ignore-existing local/outagemap &&
        mc ilm rule add --prefix incoming/ --expire-days 1 local/outagemap
  app:
    profiles: [app]
    build:
      context: .
      args:
        NEXT_PUBLIC_VECTOR_STYLE: ${NEXT_PUBLIC_VECTOR_STYLE:-https://tiles.openfreemap.org/styles/positron}
        NEXT_PUBLIC_MAP_ASSET_ORIGINS: ${NEXT_PUBLIC_MAP_ASSET_ORIGINS:-}
        NEXT_PUBLIC_SATELLITE_URL: ${NEXT_PUBLIC_SATELLITE_URL:-}
        NEXT_PUBLIC_SATELLITE_ATTRIBUTION: ${NEXT_PUBLIC_SATELLITE_ATTRIBUTION:-}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://outagemap:outagemap@postgres:5432/outagemap
      REDIS_URL: redis://redis:6379
      EMAIL_SERVER: smtp://mail:1025
      S3_ENDPOINT: http://minio:9000
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    stop_grace_period: 30s
volumes:
  postgres:
  redis:
  minio:
